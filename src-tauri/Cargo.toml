[package]
name = "computer-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "computer_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
arboard = "3.7.0"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chrono = "0.4.45"
dirs = "7.0.0"
enigo = "0.6.1"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
parking_lot = "0.13.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls", "http2", "charset"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"
sysinfo = "0.40.1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4"] }
xcap = "0.9.8"

[target."cfg(windows)".dependencies]
uiautomation = "0.25.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_HiDpi"] }

[profile.dev.package."*"]
opt-level = 2
